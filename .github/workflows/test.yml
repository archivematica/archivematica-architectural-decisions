---
name: "Test"
on:
  pull_request:
  push:
    branches:
      - "main"
jobs:
  verify-actions-lock:
    name: "Verify action lockfile"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false
      - name: "Install actions-lock"
        run: "gh extension install github/gh-actions-lock --pin v0.2.0"
        env:
          GH_TOKEN: "${{ github.token }}"
      - name: "Verify locked dependencies"
        run: "gh actions-lock --verify"
        env:
          GH_TOKEN: "${{ github.token }}"
  lint:
    name: "Lint"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7.0.1"
      - name: "Set up uv"
        uses: "astral-sh/setup-uv@v10.3.1"
        with:
          enable-cache: true
      - name: "Cache pre-commit hooks"
        uses: "actions/cache@v6.1.0"
        with:
          path: "~/.cache/pre-commit"
          key: "pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}"
      - name: "Run checks"
        run: "make check"
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      pages: "read"
    strategy:
      matrix:
        ruby-version: ["3.3", "3.4"]
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7.0.1"
      - name: "Build site"
        run: "make build RUBY_VERSION=${{ matrix.ruby-version }}"
        env:
          JEKYLL_GITHUB_TOKEN: "${{ github.token }}"
